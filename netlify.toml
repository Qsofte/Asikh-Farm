[build]
  command = "npm run build"
  publish = "build"
  functions = "functions"
  [build.environment]
    CI = "false"
    PUPPETEER_SKIP_DOWNLOAD = "false"

[dev]
  framework = "#auto"
  targetPort = 3002
  port = 8888
  functionsPort = 8889
  autoLaunch = true

# Redirect API requests to Netlify Functions proxy
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy/:splat"
  status = 200
  force = true

# SPA fallback — use 404 so pre-rendered route snapshots (react-snap) are
# served directly by Netlify's CDN before this rule is evaluated.
# A 200 rewrite here would override every pre-rendered index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
