[build]
  # npm install (not npm ci) so Netlify can resolve react-snap which is in
  # package.json but not yet in package-lock.json (local install was blocked
  # by no Chromium network access in the sandbox environment).
  command = "npm install && npm run build"
  publish = "build"
  functions = "functions"
  [build.environment]
    CI = "false"
    # Allow puppeteer (react-snap dependency) to download Chromium on Netlify.
    PUPPETEER_SKIP_DOWNLOAD = "false"

[dev]
  framework = "#auto"
  targetPort = 3002
  port = 8888
  functionsPort = 8889
  autoLaunch = true

# Redirect API requests to Netlify Functions proxy
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy/:splat"
  status = 200
  force = true

# SPA fallback for react-snap.
# react-snap writes pre-rendered index.html into each route folder AND
# creates build/200.html as the pure SPA shell fallback.
# Netlify serves the pre-rendered file when it exists (files take priority
# over non-forced redirect rules), then falls back to 200.html for any
# route that was not pre-rendered.
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
